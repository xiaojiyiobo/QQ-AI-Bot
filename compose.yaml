services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: qq-ai-bot-napcat
    restart: unless-stopped
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
      WEBUI_TOKEN: ${WEBUI_TOKEN:-napcat}
      ACCOUNT: ${NAPCAT_ACCOUNT:-}
    ports:
      - "6099:6099"
    volumes:
      - ./data/napcat/config:/app/napcat/config
      - ./data/napcat/QQ:/app/.config/QQ
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6099/webui/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - qq-ai-bot

  qq-ai-bot:
    build:
      context: .
    container_name: qq-ai-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ONEBOT_WS_URL: ws://napcat:3001
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 8080
      CONFIG_FILE_PATH: /app/data/app-config.env
    ports:
      - "8080:8080"
    volumes:
      - ./data/app:/app/data
      - ./config:/app/config:ro
    depends_on:
      napcat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - qq-ai-bot

networks:
  qq-ai-bot:
    driver: bridge
