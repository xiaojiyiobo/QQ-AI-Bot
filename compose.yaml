services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: qq-ai-bot-napcat
    restart: unless-stopped
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
      WS_ENABLE: "true"
    ports:
      - "127.0.0.1:6099:6099"
    volumes:
      - ./data/napcat/config:/app/napcat/config
      - ./data/napcat/QQ:/app/.config/QQ
    networks:
      - qq-ai-bot

  qq-ai-bot:
    build:
      context: .
    container_name: qq-ai-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ONEBOT_WS_URL: ws://napcat:3001
      NAPCAT_WEBUI_BROWSER_URL: http://127.0.0.1:6099/webui/
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - napcat
    networks:
      - qq-ai-bot

networks:
  qq-ai-bot:
    driver: bridge
